  <script><![CDATA[
    (function(){
      var svg=document.documentElement,steer=document.getElementById("steer");
      if(!steer||typeof requestAnimationFrame==="undefined")return;
      var target={x:0,y:0},cur={x:0,y:0};
      svg.addEventListener("mousemove",function(e){
        var ctm=svg.getScreenCTM?svg.getScreenCTM():null;
        if(!ctm)return;
        var p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;
        var q=p.matrixTransform(ctm.inverse());
        target.x=q.x-600;target.y=q.y-250;
      });
      (function loop(){
        cur.x+=(target.x-cur.x)*0.05;
        cur.y+=(target.y-cur.y)*0.05;
        steer.setAttribute("transform","translate("+cur.x.toFixed(1)+","+cur.y.toFixed(1)+")");
        requestAnimationFrame(loop);
      })();
    })();
  ]]></script>
</svg>