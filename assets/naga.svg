<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="nt nd">
  <title id="nt">Naga bilangan — naga matematika</title>
  <desc id="nd">Naga minimalis berwarna emas dan magenta berenang; duri punggung berdenyut, kumis berayun, dan rumus serta angka memancar naik dari ekor. Buka langsung di peramban untuk mengarahkan naga dengan kursor.</desc>
  <defs>
    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2dfad"/>
      <stop offset=".5" stop-color="#d3932c"/>
      <stop offset="1" stop-color="#c0487e"/>
    </linearGradient>
    <linearGradient id="finG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8b95c" stop-opacity=".9"/>
      <stop offset="1" stop-color="#c0487e" stop-opacity=".3"/>
    </linearGradient>
    <radialGradient id="eyeG" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset=".55" stop-color="#ffe3a0"/>
      <stop offset="1" stop-color="#e8b95c"/>
    </radialGradient>
    <filter id="nglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style><![CDATA[
    .swim{animation:swim 10s ease-in-out infinite;transform-origin:600px 250px}
    @keyframes swim{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-12px,-16px) rotate(-1.1deg)}50%{transform:translate(4px,-6px) rotate(.7deg)}75%{transform:translate(-2px,12px) rotate(.5deg)}}
    .seg{animation:wave 2.2s ease-in-out infinite}
    .s1{animation-delay:-.05s}.s2{animation-delay:-.10s}.s3{animation-delay:-.15s}.s4{animation-delay:-.20s}
    .s5{animation-delay:-.25s}.s6{animation-delay:-.30s}.s7{animation-delay:-.35s}.s8{animation-delay:-.40s}
    .s9{animation-delay:-.45s}.s10{animation-delay:-.50s}.s11{animation-delay:-.55s}.s12{animation-delay:-.60s}
    .s13{animation-delay:-.65s}.s14{animation-delay:-.70s}.s15{animation-delay:-.75s}.s16{animation-delay:-.80s}
    @keyframes wave{0%,100%{transform:translateY(-7px)}50%{transform:translateY(7px)}}
    .spine{animation:spine 1.5s ease-in-out infinite;transform-origin:center top;transform-box:fill-box}
    @keyframes spine{0%,100%{opacity:.5;transform:scaleY(.82)}50%{opacity:1;transform:scaleY(1.2)}}
    .whisker{animation:whisk 3s ease-in-out infinite}
    @keyframes whisk{0%,100%{transform:rotate(-4.5deg)}50%{transform:rotate(4.5deg)}}
    .tailfin{animation:fin 1.4s ease-in-out infinite;transform-origin:32px 222px}
    @keyframes fin{0%,100%{transform:rotate(-9deg) scaleX(.9)}50%{transform:rotate(9deg) scaleX(1.06)}}
    .eyeglow{animation:blink 4.2s ease-in-out infinite}
    @keyframes blink{0%,90%,100%{opacity:1}94%{opacity:.25}}
    .math{animation:rise 3.4s ease-out infinite}
    .m1{animation-delay:-.0s}.m2{animation-delay:-.5s}.m3{animation-delay:-1.0s}.m4{animation-delay:-1.5s}
    .m5{animation-delay:-2.0s}.m6{animation-delay:-2.5s}.m7{animation-delay:-2.2s}.m8{animation-delay:-3.0s}
    .mval{animation:rise 4.6s ease-out infinite}
    .v1{animation-delay:-.3s}.v2{animation-delay:-1.4s}.v3{animation-delay:-2.6s}.v4{animation-delay:-3.9s}
    @keyframes rise{0%{opacity:0;transform:translate(0,0) scale(.5)}18%{opacity:1;transform:translate(-6px,-14px) scale(1)}80%{opacity:.8}100%{opacity:0;transform:translate(-24px,-100px) scale(.72)}}
    .star{animation:tw 3s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
  ]]></style>
  <rect width="1200" height="500" rx="16" fill="#07070e"/>
  <rect width="1200" height="500" rx="16" fill="none" stroke="#1b1b24" stroke-width="2"/>
  <g id="steer">
    <g fill="#f1d9a0">
      <circle class="star" cx="60" cy="52" r="1.1"/>
      <circle class="star" cx="180" cy="432" r=".9"/>
      <circle class="star" cx="300" cy="40" r="1.2"/>
      <circle class="star" cx="900" cy="46" r="1"/>
      <circle class="star" cx="1050" cy="420" r=".9"/>
      <circle class="star" cx="1132" cy="92" r=".8"/>
      <circle class="star" cx="470" cy="462" r=".7"/>
      <circle class="star" cx="720" cy="32" r="1"/>
      <circle class="star" cx="560" cy="468" r=".8"/>
      <circle class="star" cx="118" cy="130" r=".7"/>
      <circle class="star" cx="1020" cy="180" r=".6"/>
      <circle class="star" cx="410" cy="66" r=".7"/>
    </g>
    <g class="swim">
      <g id="dragon">
        <path d="M145 250 C 300 253, 520 246, 700 250 S 880 246 910 250" fill="none" stroke="url(#bodyG)" stroke-width="30" stroke-linecap="round" opacity=".35"/>
        <path d="M145 250 C 110 252, 76 238, 34 224 L 46 216 C 82 226, 116 238, 145 243 Z" fill="url(#bodyG)" opacity=".92"/>
        <path class="tailfin" d="M34 224 C 22 217, 6 206, -6 195 L 4 199 C 8 208, 16 216, 28 220 Z" fill="url(#finG)"/>
        <ellipse class="seg s16" cx="145" cy="250" rx="10" ry="8" fill="url(#bodyG)"/>
        <ellipse class="seg s15" cx="190" cy="250" rx="11" ry="8.5" fill="url(#bodyG)"/>
        <ellipse class="seg s14" cx="235" cy="250" rx="12" ry="9" fill="url(#bodyG)"/>
        <ellipse class="seg s13" cx="280" cy="250" rx="13" ry="9.5" fill="url(#bodyG)"/>
        <ellipse class="seg s12" cx="325" cy="250" rx="14" ry="10.2" fill="url(#bodyG)"/>
        <ellipse class="seg s11" cx="370" cy="250" rx="15" ry="11" fill="url(#bodyG)"/>
        <ellipse class="seg s10" cx="415" cy="250" rx="15.5" ry="11.6" fill="url(#bodyG)"/>
        <ellipse class="seg s9" cx="460" cy="250" rx="16" ry="12.2" fill="url(#bodyG)"/>
        <ellipse class="seg s8" cx="505" cy="250" rx="16.5" ry="12.8" fill="url(#bodyG)"/>
        <ellipse class="seg s7" cx="550" cy="250" rx="17" ry="13.4" fill="url(#bodyG)"/>
        <ellipse class="seg s6" cx="595" cy="250" rx="17.5" ry="14" fill="url(#bodyG)"/>
        <ellipse class="seg s5" cx="640" cy="250" rx="17.5" ry="14.4" fill="url(#bodyG)"/>
        <ellipse class="seg s4" cx="685" cy="250" rx="17.5" ry="14.6" fill="url(#bodyG)"/>
        <ellipse class="seg s3" cx="730" cy="250" rx="17" ry="14.6" fill="url(#bodyG)"/>
        <ellipse class="seg s2" cx="775" cy="250" rx="17" ry="14.4" fill="url(#bodyG)"/>
        <ellipse class="seg s1" cx="820" cy="250" rx="16.5" ry="14" fill="url(#bodyG)"/>
        <g class="spine" fill="#f2dfad">
          <polygon points="145,243 151,233 157,243"/>
          <polygon points="190,242 196,231 202,242"/>
          <polygon points="235,241 241,229 247,241"/>
          <polygon points="280,241 286,228 292,241"/>
          <polygon points="325,240 331,226 337,240"/>
          <polygon points="370,239 376,224 382,239"/>
          <polygon points="415,238 421,222 427,238"/>
          <polygon points="460,238 466,221 472,238"/>
          <polygon points="505,237 511,220 517,237"/>
          <polygon points="550,237 556,219 562,237"/>
          <polygon points="595,236 601,218 607,236"/>
          <polygon points="640,236 646,218 652,236"/>
          <polygon points="685,235 691,218 697,235"/>
          <polygon points="730,235 736,219 742,235"/>
          <polygon points="775,236 781,220 787,236"/>
          <polygon points="820,236 826,221 832,236"/>
        </g>
        <g id="head" transform="translate(872 250)">
          <path d="M0 0 L40 -22 L58 -16 L66 -2 L58 16 L40 22 Z" fill="url(#bodyG)"/>
          <path d="M40 -22 L50 -40 L62 -26 L58 -16 Z" fill="#d3932c"/>
          <path d="M40 22 L50 40 L62 26 L58 16 Z" fill="#d3932c"/>
          <path d="M58 -16 L82 -26 L86 -16 L66 -2 Z" fill="#e8b95c"/>
          <path d="M58 16 L82 26 L86 16 L66 2 Z" fill="#e8b95c"/>
          <circle class="eyeglow" cx="36" cy="-5" r="4" fill="url(#eyeG)" filter="url(#nglow)"/>
          <circle cx="36" cy="-5" r="1.6" fill="#0b0d12"/>
          <circle class="eyeglow" cx="36" cy="5" r="4" fill="url(#eyeG)" filter="url(#nglow)"/>
          <circle cx="36" cy="5" r="1.6" fill="#0b0d12"/>
          <path class="whisker" style="transform-origin:58px -8px" d="M58 -8 C 76 -24, 104 -30, 126 -22" fill="none" stroke="#e7d5ae" stroke-width="1.5" stroke-opacity=".7" stroke-linecap="round"/>
          <path class="whisker" style="transform-origin:58px -3px" d="M58 -3 C 78 -14, 110 -14, 130 -6" fill="none" stroke="#e7d5ae" stroke-width="1.3" stroke-opacity=".6" stroke-linecap="round"/>
          <path class="whisker" style="transform-origin:58px -9px" d="M58 -12 C 78 -27, 104 -35, 124 -29" fill="none" stroke="#e7d5ae" stroke-width="1" stroke-opacity=".5" stroke-linecap="round"/>
          <path class="whisker" style="transform-origin:58px 8px" d="M58 8 C 76 24, 104 30, 126 22" fill="none" stroke="#e7d5ae" stroke-width="1.5" stroke-opacity=".7" stroke-linecap="round"/>
          <path class="whisker" style="transform-origin:58px 3px" d="M58 3 C 78 14, 110 14, 130 6" fill="none" stroke="#e7d5ae" stroke-width="1.3" stroke-opacity=".6" stroke-linecap="round"/>
          <path d="M66 -2 L84 -2 L92 0 L84 2 L66 2 Z" fill="#c0487e" opacity=".55"/>
        </g>
      </g>
      <g class="math" font-family="Georgia,serif" font-size="15" text-anchor="middle">
        <text class="m1" x="38" y="212" fill="#e8b95c">&#8747;</text>
        <text class="m2" x="38" y="212" fill="#c0487e">&#960;</text>
        <text class="m3" x="38" y="212" fill="#f0dcb2">&#8721;</text>
        <text class="m4" x="38" y="212" fill="#e8b95c">&#966;</text>
        <text class="m5" x="38" y="212" fill="#c0487e">&#8730;</text>
        <text class="m6" x="38" y="212" fill="#f0dcb2">e</text>
        <text class="m7" x="38" y="212" fill="#e8b95c">&#8734;</text>
        <text class="m8" x="38" y="212" fill="#c0487e">&#8706;</text>
      </g>
      <g class="mval" font-family="Georgia,serif" font-size="11" fill="#e7d5ae" text-anchor="middle" opacity=".85">
        <text class="v1" x="38" y="212">3.14159</text>
        <text class="v2" x="38" y="212">1.61803</text>
        <text class="v3" x="38" y="212">2.71828</text>
        <text class="v4" x="38" y="212">1.41421</text>
      </g>
    </g>
    <g font-family="Arial,Helvetica,sans-serif" letter-spacing="3" font-size="9">
      <text x="38" y="32" fill="#e3d2a6" opacity=".55">NAGA BILANGAN</text>
      <text x="1162" y="32" text-anchor="end" fill="#c0487e" opacity=".8">RUMUS MEMANCAR DARI EKOR</text>
      <text x="600" y="468" text-anchor="middle" fill="#e8b95c" opacity=".85">DURI BERDENYUT &#183; KUMIS BERAYUN &#183; RUMUS MEMANCAR DARI EKOR</text>
      <text x="600" y="484" text-anchor="middle" fill="#c0487e" opacity=".6">&#8747; &#960; &#8721; &#966; &#8730; e &#8734; &#8706;</text>
    </g>
  </g>
  <script><![CDATA[
    (function(){
      var svg=document.documentElement,steer=document.getElementById("steer");
      if(!steer||typeof requestAnimationFrame==="undefined")return;
      var target={x:0,y:0},cur={x:0,y:0};
      svg.addEventListener("mousemove",function(e){
        var ctm=svg.getScreenCTM?svg.getScreenCTM():null;
        if(!ctm)return;
        var p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;
        var q=p.matrixTransform(ctm.inverse());
        target.x=q.x-600;target.y=q.y-250;
      });
      (function loop(){
        cur.x+=(target.x-cur.x)*0.05;
        cur.y+=(target.y-cur.y)*0.05;
        steer.setAttribute("transform","translate("+cur.x.toFixed(1)+","+cur.y.toFixed(1)+")");
        requestAnimationFrame(loop);
      })();
    })();
  ]]></script>
</svg>