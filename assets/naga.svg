<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="nt nd">
  <title id="nt">Naga API — naga matematika</title>
  <desc id="nd">Naga api berwarna emas dan magenta berenang mengintai; duri punggung tajam berdenyut, taring menyala, api keluar dari mulut, dan rumus memancar dari ekor. Buka halaman interaktif untuk mengarahkan naga dengan kursor.</desc>
  <defs>
    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e3b3"/>
      <stop offset=".45" stop-color="#d3932c"/>
      <stop offset=".8" stop-color="#9c2f52"/>
      <stop offset="1" stop-color="#c0487e"/>
    </linearGradient>
    <linearGradient id="bladeG" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#c0487e" stop-opacity=".25"/>
      <stop offset="1" stop-color="#f2dfad"/>
    </linearGradient>
    <radialGradient id="auraG" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4a1444" stop-opacity=".65"/>
      <stop offset=".6" stop-color="#2a0b36" stop-opacity=".25"/>
      <stop offset="1" stop-color="#07070e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeG" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset=".5" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#ff8a3c"/>
    </radialGradient>
    <filter id="nglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fireglow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style><![CDATA[
    .swim{animation:swim 7.5s ease-in-out infinite;transform-origin:600px 250px}
    @keyframes swim{0%,100%{transform:translate(0,0) rotate(0)}20%{transform:translate(-10px,-18px) rotate(-1.4deg)}45%{transform:translate(4px,-2px) rotate(.8deg)}65%{transform:translate(-2px,14px) rotate(-.6deg)}85%{transform:translate(6px,-4px) rotate(.5deg)}}
    .seg{animation:wave 1.9s ease-in-out infinite}
    .s1{animation-delay:-.06s}.s2{animation-delay:-.12s}.s3{animation-delay:-.18s}.s4{animation-delay:-.24s}
    .s5{animation-delay:-.30s}.s6{animation-delay:-.36s}.s7{animation-delay:-.42s}.s8{animation-delay:-.48s}
    .s9{animation-delay:-.54s}.s10{animation-delay:-.60s}.s11{animation-delay:-.66s}.s12{animation-delay:-.72s}
    .s13{animation-delay:-.78s}.s14{animation-delay:-.84s}.s15{animation-delay:-.90s}.s16{animation-delay:-.96s}
    @keyframes wave{0%,100%{transform:translateY(-9px)}50%{transform:translateY(9px)}}
    .blade{transform-origin:center 12px;transform-box:fill-box}
    .b1{animation:bladepulse 1.3s ease-in-out infinite}
    .b2{animation:bladepulse 1.7s ease-in-out infinite;animation-delay:-.5s}
    @keyframes bladepulse{0%,100%{opacity:.55;transform:scaleY(.86)}50%{opacity:1;transform:scaleY(1.16)}}
    .whisker{animation:whisk 2.8s ease-in-out infinite}
    @keyframes whisk{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
    .tailfin{animation:fin 1.2s ease-in-out infinite;transform-origin:60px 246px}
    @keyframes fin{0%,100%{transform:rotate(-8deg) scaleX(.92)}50%{transform:rotate(8deg) scaleX(1.07)}}
    .eyeglow{animation:blink 4s ease-in-out infinite}
    @keyframes blink{0%,88%,100%{opacity:1}93%{opacity:.15}}
    .fire{animation:flick 1.1s ease-in infinite;transform-origin:72px 0px}
    .f1{animation-delay:-.0s}.f2{animation-delay:-.15s}.f3{animation-delay:-.3s}.f4{animation-delay:-.45s}
    .f5{animation-delay:-.6s}.f6{animation-delay:-.75s}.f7{animation-delay:-.9s}
    @keyframes flick{0%{opacity:0;transform:translate(0,0) scale(.35)}30%{opacity:.95}55%{opacity:.7;transform:translate(14px,-16px) scale(1.15)}100%{opacity:0;transform:translate(26px,-44px) scale(.55)}}
    .ember{animation:emberRise 2.6s ease-out infinite}
    .e1{animation-delay:-.0s}.e2{animation-delay:-.4s}.e3{animation-delay:-.8s}.e4{animation-delay:-1.2s}
    .e5{animation-delay:-1.6s}.e6{animation-delay:-2.0s}.e7{animation-delay:-2.3s}
    @keyframes emberRise{0%{opacity:0;transform:translate(0,0) scale(.4)}12%{opacity:.9}70%{opacity:.6}100%{opacity:0;transform:translate(-26px,-86px) scale(1.15)}}
    .math{animation:rise 3s ease-out infinite}
    .m1{animation-delay:-.0s}.m2{animation-delay:-.5s}.m3{animation-delay:-1.0s}.m4{animation-delay:-1.5s}
    .m5{animation-delay:-2.0s}.m6{animation-delay:-2.5s}.m7{animation-delay:-2.2s}.m8{animation-delay:-2.9s}
    .mval{animation:rise 4.2s ease-out infinite}
    .v1{animation-delay:-.3s}.v2{animation-delay:-1.4s}.v3{animation-delay:-2.6s}.v4{animation-delay:-3.8s}
    @keyframes rise{0%{opacity:0;transform:translate(0,0) scale(.55)}16%{opacity:1;transform:translate(-6px,-14px) scale(1)}78%{opacity:.85}100%{opacity:0;transform:translate(-24px,-104px) scale(.78)}}
    .star{animation:tw 3.4s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.12}50%{opacity:1}}
    .headbob{animation:headbob 3.4s ease-in-out infinite;transform-origin:880px 250px}
    @keyframes headbob{0%,100%{transform:rotate(0)}30%{transform:rotate(.8deg) translate(-2px,-4px)}65%{transform:rotate(-.7deg) translate(1px,3px)}}
  ]]></style>
