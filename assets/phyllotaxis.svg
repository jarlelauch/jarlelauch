  <title id="pt">Filotaksis — spiral bunga matahari</title>
  <desc id="pd">Titik-titik tumbuh pada sudut emas 137,5° membentuk spiral Fibonacci: 34 dan 55 spiral yang terlihat.</desc>
  <defs>
    <radialGradient id="pc" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#0b0d12"/><stop offset="1" stop-color="#04050a"/>
    </radialGradient>
    <filter id="pg" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style><![CDATA[
    .seed { animation: grow 3s ease-in-out infinite; }
    @keyframes grow { 0%,100% { opacity: .35; transform: scale(.6); } 50% { opacity: 1; transform: scale(1.4); } }
    .fib { stroke-dasharray: 4 8; animation: fmarch 24s linear infinite; }
    @keyframes fmarch { to { stroke-dashoffset: -400; } }
  ]]></style>

  <rect width="1200" height="430" rx="14" fill="url(#pc)"/>

