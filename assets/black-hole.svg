<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Mathematical black hole — obsidian engine</title>
  <desc id="desc">A brutal obsidian black hole with photon ring, spiraling particle garlands, shockwaves, and equations falling through the event horizon.</desc>
  <defs>
    <radialGradient id="abyss" cx="50%" cy="50%" r="62%">
      <stop offset="0" stop-color="#000005"/>
      <stop offset=".31" stop-color="#07070f"/>
      <stop offset=".6" stop-color="#2a1730" stop-opacity=".82"/>
      <stop offset=".72" stop-color="#b34a86" stop-opacity=".26"/>
      <stop offset="1" stop-color="#dfab62" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#000"/>
      <stop offset=".72" stop-color="#010108"/>
      <stop offset=".9" stop-color="#261226"/>
      <stop offset="1" stop-color="#d3912c"/>
    </radialGradient>
    <filter id="warp" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="11" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="gld" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe6ab"/>
      <stop offset=".42" stop-color="#d3932c"/>
      <stop offset="1" stop-color="#9c2f52"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1=".53" x2="1" y2=".53">
      <stop offset="0" stop-color="#e7d5ae" stop-opacity="0"/>
      <stop offset=".32" stop-color="#e7d5ae" stop-opacity=".84"/>
      <stop offset=".69" stop-color="#cb5188" stop-opacity=".84"/>
      <stop offset="1" stop-color="#cb5188" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="17"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="gr" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#bda16b" stroke-opacity=".045" stroke-width=".6"/>
    </pattern>
    <path id="gnomon" d="M8 42h90m60-00v12m48 00h74m-56 00v12h43"/>
    <style><![CDATA[
      .ring { transform-origin: 600px 215px; }
      .r1 { animation: spin 3.4s linear infinite; }
      .r2 { animation: backspin 2.2s linear infinite; }
      .r3 { animation: spin 10s linear infinite; }
      .r4 { animation: backspin 23s linear infinite; }
      .dot { animation: orbit 1.1s linear infinite; }
      .dot2 { animation: orbit .74s linear infinite; }
      .glow-a { animation: burn 1.3s cubic-bezier(.86,0,.95,.3) infinite; }
      .glow-b { animation: burn 1.05s cubic-bezier(.86,0,.95,.3) infinite; animation-delay: -.45s; }
      .glow-c { animation: burn .8s cubic-bezier(.86,0,.95,.3) infinite; animation-delay: -.62s; }
      .glow-d { animation: burn .6s cubic-bezier(.86,0,.95,.3) infinite; animation-delay: -.32s; }
      .horizon { animation: heart 1.6s cubic-bezier(.75,0,.25,1) infinite; transform-origin: 600px 215px; }
      .acc { animation: spin 1.7s linear infinite; transform-origin: 600px 215px; }
      .glyph { fill:#f0dcb2; font-family: Georgia,'Times New Roman',serif; filter:url(#glow); }
      .p1 { animation: pull-a 2.2s cubic-bezier(.84,.01,.97,.27) infinite; }
      .p2 { animation: pull-b 2.6s cubic-bezier(.84,.01,.97,.27) infinite; animation-delay:-1.1s; }
      .p3 { animation: pull-c 3s cubic-bezier(.84,.01,.97,.27) infinite; animation-delay:-1.7s; }
      .p4 { animation: pull-d 1.9s cubic-bezier(.84,.01,.97,.27) infinite; animation-delay:-.7s; }
      .p5 { animation: pull-a 1.6s cubic-bezier(.9,0,1,.2) infinite; animation-delay:-.8s; }
      .p6 { animation: pull-b 1.8s cubic-bezier(.9,0,1,.2) infinite; animation-delay:-1.4s; }
      .p7 { animation: pull-c 2s cubic-bezier(.9,0,1,.2) infinite; animation-delay:-.5s; }
      .p8 { animation: pull-d 2.4s cubic-bezier(.9,0,1,.2) infinite; animation-delay:-1.8s; }
      .shat{ transform-origin:600px 215px; animation: shatter .55s steps(2,end) infinite; filter:url(#glow); }
      .shat.a{ animation-delay:0s } .shat.b{ animation-delay:-.28s } .shat.c{ animation-delay:-.14s } .shat.d{ animation-delay:-.42s }
      .shat.e{ animation-delay:-.1s } .shat.f{ animation-delay:-.36s } .shat.g{ animation-delay:-.22s }
      .dust { opacity:.5 }
      .tail { stroke-dasharray:12 96; animation: snake 1.2s linear infinite; }
      .tail.tb { animation-delay:-.3s } .tail.tc { animation-delay:-.6s } .tail.td { animation-delay:-.9s }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes backspin { to { transform: rotate(-360deg); } }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes burn { 0%,78%,100% { opacity:0 } 84% { opacity:1 } 92% { opacity:.25 } }
      @keyframes heart { 0%,100% { opacity:.52; transform:scale(.86) } 40% { opacity:1; transform:scale(1.19) } 60% { opacity:.22; transform:scale(.72) } }
      @keyframes pull-a { 0%{transform:translate(-34px,-20px) scale(1);opacity:0} 15%{opacity:.95} 78%{opacity:.8} 100%{transform:translate(486px,96px) scale(.07);opacity:0} }
      @keyframes pull-b { 0%{transform:translate(166px,104px) scale(1);opacity:0} 17%{opacity:.85} 74%{opacity:.75} 100%{transform:translate(232px,-76px) scale(.05);opacity:0} }
      @keyframes pull-c { 0%{transform:translate(-80px,28px) scale(1);opacity:0} 13%{opacity:.85} 80%{opacity:.65} 100%{transform:translate(422px,-46px) scale(.05);opacity:0} }
      @keyframes pull-d { 0%{transform:translate(78px,-84px) scale(1);opacity:0} 19%{opacity:.9} 76%{opacity:.7} 100%{transform:translate(-78px,146px) scale(.05);opacity:0} }
      @keyframes shatter { 0%,24%{opacity:0;transform:rotate(0) scale(.06)} 38%{opacity:1} 100%{opacity:0;transform:rotate(270deg) scale(1.78)} }
      @keyframes snake { to { stroke-dashoffset:-432; } }
    ]]></style>
  </defs>

  <rect width="1200" height="430" rx="16" fill="#07070e"/>
  <rect width="1200" height="430" rx="16" fill="url(#gr)"/>
  <path d="M46 215H1154M600 26V404" class="tail" stroke="#d5c08c" stroke-width="1" opacity=".32"/>
  <path d="M-14 95C242 105 398 178 570 212" fill="none" stroke="url(#ink)" stroke-width="1" opacity=".45"/>
  <path d="M1214 336C958 326 804 265 630 223" fill="none" stroke="url(#ink)" stroke-width="1" opacity=".45"/>

  <g fill="#f7e3a4">
    <circle cx="84" cy="64" r="1.2"/><circle cx="190" cy="330" r=".9"/><circle cx="276" cy="120" r="1.3"/><circle cx="388" cy="52" r=".9"/>
    <circle cx="920" cy="68" r="1"/><circle cx="1078" cy="242" r="1.2"/><circle cx="1016" cy="372" r=".8"/><circle cx="764" cy="30" r=".8"/>
  </g>

  <g class="ring r2" fill="none" opacity=".44">
    <ellipse cx="600" cy="215" rx="398" ry="181" stroke="url(#gld)" stroke-width="1" stroke-dasharray="160 28 6 31"/>
    <ellipse cx="600" cy="215" rx="333" ry="108" stroke="#d9b06a" stroke-width=".9" stroke-dasharray="2 13"/>
  </g>
  <g class="ring r3" fill="none" opacity=".38">
    <ellipse cx="600" cy="215" rx="318" ry="100" stroke="url(#gld)" stroke-width="1" stroke-dasharray="64 18 5 18"/>
    <ellipse cx="600" cy="215" rx="290" ry="88" stroke="#9d3a5d" stroke-width=".7" stroke-dasharray="2 20"/>
  </g>
  <ellipse class="ring r4" cx="600" cy="215" rx="452" ry="132" fill="none" stroke="#b35f6c" stroke-width=".8" stroke-dasharray="4 22" opacity=".4"/>

  <g class="acc" fill="none">
    <ellipse cx="600" cy="215" rx="176" ry="63" stroke="url(#gld)" stroke-width="6" stroke-linecap="round" stroke-dasharray="110 58 10 24" filter="url(#glow)" opacity=".9"/>
    <ellipse cx="600" cy="215" rx="153" ry="48" stroke="#e6c382" stroke-width="1.5" stroke-dasharray="9 11 84 13" opacity=".85"/>
    <path d="M600 154C544 163 477 181 438 199 420 212 451 228 522 237 600 252C598 130 574 93 625 96 663 126" fill="none" stroke="#b24c7d" stroke-width="1.3" opacity=".6"/>
  </g>

  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <path class="tail" d="M18 162C246 178 412 190 556 214" stroke="#f0be6d" stroke-width="1.4" opacity=".68"/>
    <path class="tail tb" d="M1182 252C966 244 786 232 648 221" stroke="#d05ba3" stroke-width="1.1" opacity=".7"/>
    <path class="tail tc" d="M788 6C736 92 672 146 617 200" stroke="#f0be6d" stroke-width="1" opacity=".5"/>
    <path class="tail td" d="M372 428C436 322 512 271 580 229" stroke="#d05ba3" stroke-width=".9" opacity=".5"/>
  </g>

  <g class="p1 glyph" font-size="20"><text x="88" y="116">∫ 0 1</text><text x="176" y="150" font-size="12">dx</text></g>
  <g class="p2 glyph" font-size="23"><text x="882" y="112">∞</text><text x="918" y="140" font-size="11">lim</text></g>
  <g class="p3 glyph" font-size="19"><text x="70" y="256">φ = 1.618</text></g>
  <g class="p4 glyph" font-size="26"><text x="758" y="70">Σ</text><text x="806" y="78" font-size="12">n=1</text></g>
  <g class="p5 glyph" font-size="16"><text x="1000" y="330">∂/∂t</text></g>
  <g class="p6 glyph" font-size="16"><text x="246" y="362">eⁱᵖ + 1 = 0</text></g>
  <g class="p7 glyph" font-size="20"><text x="60" y="178">∄</text><text x="94" y="178" font-size="13">VOID</text></g>
  <g class="p8 glyph" font-size="15"><text x="1062" y="180">√−1</text></g>
  <g class="p5 glyph" font-size="17"><text x="414" y="46">λ ≠ 0</text></g>
  <g class="p6 glyph" font-size="16"><text x="840" y="383">∆S → ∞</text></g>
  <g class="p7 glyph" font-size="18"><text x="76" y="334">γ = lim 1/n</text></g>
  <g class="p8 glyph" font-size="18"><text x="942" y="78">∏</text></g>

  <g transform="translate(600 215)">
    <circle r="205" fill="url(#abyss)" opacity=".9"/>
    <circle class="horizon" r="127" fill="none" stroke="#c15b8f" stroke-width="2" stroke-dasharray="2 12" opacity=".8"/>
    <circle r="212" fill="none" stroke="#f7c880" stroke-width="3" stroke-opacity=".95" filter="url(#soft)" opacity=".4"/>
    <g class="glow-a" fill="none" stroke="#f8c46c"><circle r="30" stroke-width="4" opacity=".8"/></g>
    <g class="glow-b" fill="none" stroke="#e97b3c"><circle r="48" stroke-width="3" opacity=".7"/></g>
    <g class="glow-c" fill="none" stroke="#c8488e"><circle r="66" stroke-width="2" opacity=".6"/></g>
    <g class="glow-d" fill="none" stroke="#f2d093"><circle r="84" stroke-width="1.4" opacity=".5"/></g>
    <circle class="dot" cx="136" cy="0" r="2.4" fill="#ffd894" filter="url(#glow)"/>
    <circle class="dot2" cx="-122" cy="0" r="1.8" fill="#d86bbd" filter="url(#glow)"/>
    <circle class="dot" cx="0" cy="-96" r="1.5" fill="#f7b95c" opacity=".9"/>
    <circle r="96" fill="url(#core)" filter="url(#warp)"/>
    <circle r="71" fill="#000109"/>
    <circle r="50" fill="#000"/>
  </g>

  <g fill="url(#gld)" class="shat">
    <path d="M602 206l34-24-17 36z"/><path class="b" d="M603 205l-14-45 29 36z"/><path class="c" d="M599 223l-41 23 28-37z"/><path class="d" d="M610 221l40 9-35-24z"/>
    <path class="e" d="M598 209l-22-16 30 26z"/><path class="f" d="M604 210l25 18-18-30z"/><path class="g" d="M607 224l-30 12 24-18z"/>
  </g>

  <g fill="none" stroke="#e5d0a0" stroke-opacity=".42" stroke-width="1">
    <path d="M44 42h90m-90 0v18m90-18v18M1066 388h90m-90 0v-18m90 18v-18"/>
    <path d="M44 384v-35m0 35h35M1156 46v35m0-35h-35"/>
  </g>
  <g class="caption" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#e3d2a6" letter-spacing="4">
    <text x="62" y="63">SINGULARITY / 00.000</text>
    <text x="941" y="384">EVENT HORIZON / ∆t</text>
    <text x="62" y="401" fill="#c06a8b">MATH IS A GRAVITATIONAL LANGUAGE</text>
  </g>
  <g class="caption" text-anchor="middle">
    <text x="600" y="205" font-size="10" fill="#ecdcb2">00110110</text>
    <text x="600" y="232" font-size="7" fill="#a26a7d">∅</text>
  </g>
</svg>