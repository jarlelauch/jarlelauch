<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="tt dd">
  <title id="tt">Orbital engine — clockwork singularity</title>
  <desc id="dd">Numbers and constants orbit endlessly around a central singularity across three tilted planes, with comet trails, pulsing photon rings and hover flares.</desc>
  <defs>
    <radialGradient id="hub" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#000006"/>
      <stop offset=".3" stop-color="#06060f"/>
      <stop offset=".58" stop-color="#220f2c" stop-opacity=".84"/>
      <stop offset=".72" stop-color="#b04b88" stop-opacity=".27"/>
      <stop offset="1" stop-color="#e0ac5e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nucleus">
      <stop offset="0" stop-color="#000"/>
      <stop offset=".66" stop-color="#010108"/>
      <stop offset=".9" stop-color="#241226"/>
      <stop offset="1" stop-color="#d3932c"/>
    </radialGradient>
    <linearGradient id="goldline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e7d5ae" stop-opacity="0"/>
      <stop offset=".33" stop-color="#e7d5ae" stop-opacity=".8"/>
      <stop offset=".68" stop-color="#c0487e" stop-opacity=".8"/>
      <stop offset="1" stop-color="#c0487e" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow3" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="faint" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <pattern id="web" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#b79a5e" stroke-opacity=".05" stroke-width=".55"/>
    </pattern>
    <style><![CDATA[
      .plane { transform-origin: 600px 215px; }
      .tilt-a { animation: precess 44s linear infinite; }
      .tilt-b { animation: precess 31s linear infinite; animation-delay: -12s; }
      .tilt-c { animation: precess 67s linear infinite; }
      .spin-a { animation: orbit 11s linear infinite; transform-origin: 0px 0px; }
      .spin-b { animation: orbit 17s linear infinite reverse; transform-origin: 0px 0px; }
      .spin-c { animation: orbit 29s linear infinite; transform-origin: 0px 0px; animation-delay: -9s; }
      .ringp { stroke-dasharray: 30 14 5 22; animation: orbit 14s linear infinite; transform-origin: 600px 215px; }
      .ringq { stroke-dasharray: 2 26; animation: orbit 9s linear infinite; transform-origin: 600px 215px; }
      .comet { stroke-dasharray: 14 130; animation: orbit 6s linear infinite; transform-origin: 600px 215px; }
      .core-pulse { animation: pulse 3s cubic-bezier(.75,0,.25,1) infinite; transform-origin: 600px 215px; }
      .star { animation: blink 2.2s steps(2, end) infinite alternate; }
      .m1 { animation-delay: -.6s; } .m2 { animation-delay: -1.3s; } .m3 { animation-delay: -1.9s; }
      .num { font-family: Georgia,'Times New Roman',serif; fill: #f0dcb2; font-size: 19px; text-anchor: middle; dominant-baseline: central; filter: url(#glow3); opacity: .62; cursor: pointer; transition: opacity .25s; }
      .num:hover { opacity: 1; }
      .cap { font-family: Arial,Helvetica,sans-serif; letter-spacing: 4px; fill: #e3d2a6; font-size: 9px; }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes precess { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { opacity: .55; transform: scale(.9); } 45% { opacity: 1; transform: scale(1.14); } }
      @keyframes blink { 50% { opacity: .15; } }
    ]]></style>
  </defs>
<rect width="1200" height="430" rx="16" fill="#07070e"/>
  <rect width="1200" height="430" rx="16" fill="url(#web)"/>
  <path d="M46 74H1154M46 356H1154" stroke="url(#goldline)" stroke-width="1" opacity=".55"/>

  <g fill="#f5dfa2">
    <circle class="star" cx="90" cy="60" r="1.3"/><circle class="star m1" cx="196" cy="342" r=".9"/><circle class="star m2" cx="302" cy="118" r="1.4"/>
    <circle class="star m3" cx="476" cy="46" r=".9"/><circle class="star" cx="1016" cy="348" r="1"/><circle class="star m1" cx="1108" cy="120" r="1.3"/>
    <circle class="star m2" cx="870" cy="384" r=".9"/><circle class="star m3" cx="726" cy="30" r=".8"/>
  </g>

  <!-- plane C (behind) -->
  <g class="plane tilt-c">
    <ellipse cx="600" cy="215" rx="342" ry="144" fill="none" stroke="#8f6aa0" stroke-width=".7" stroke-opacity=".38" stroke-dasharray="4 26"/>
    <g transform="translate(600 215) scale(1 .42)">
      <g class="spin-c">
        <g fill="#c48d5e"><circle cx="342" cy="0" r="2.6"/><circle cx="-218" cy="0" r="2"/><circle cx="56" cy="0" r="1.8"/></g>
        <g class="num" transform="rotate(0) translate(342 0) scale(1 2.38)"><text x="0" y="0">∞</text></g>
        <g class="num" transform="rotate(130) translate(218 0) scale(1 2.38)"><text x="0" y="0">0</text></g>
        <g class="num" transform="rotate(250) translate(268 0) scale(1 2.38)"><text x="0" y="0">1</text></g>
      </g>
    </g>
  </g>

  <!-- plane B (middle) -->
  <g class="plane tilt-b">
    <ellipse cx="600" cy="215" rx="248" ry="104" fill="none" stroke="#a0607e" stroke-width=".8" stroke-opacity=".45" stroke-dasharray="8 20"/>
    <ellipse class="ringp" cx="600" cy="215" rx="248" ry="104" fill="none" stroke="#e8b95c" stroke-width="1" stroke-opacity=".55"/>
    <g transform="translate(600 215) scale(1 .42)">
      <g class="spin-b">
        <g fill="#e8b95c"><circle cx="-224" cy="0" r="2.9"/><circle cx="94" cy="0" r="2.4"/><circle cx="222" cy="0" r="2.4"/></g>
        <g class="num" transform="rotate(0) translate(224 0) scale(1 2.38)"><text x="0" y="0">φ</text></g>
        <g class="num" transform="rotate(140) translate(150 0) scale(1 2.38)"><text x="0" y="0">Σ</text></g>
        <g class="num" transform="rotate(252) translate(176 0) scale(1 2.38)"><text x="0" y="0">∫</text></g>
      </g>
    </g>
  </g>

  <!-- plane A (front) -->
  <g class="plane tilt-a">
    <ellipse cx="600" cy="215" rx="166" ry="70" fill="none" stroke="#b34f7e" stroke-width=".8" stroke-opacity=".5" stroke-dasharray="2 9"/>
    <g transform="translate(600 215) scale(1 .42)">
      <g class="spin-a">
        <g fill="#f0dcb2"><circle cx="166" cy="0" r="3.2"/><circle cx="-116" cy="0" r="2.4"/><circle cx="30" cy="0" r="2.2"/></g>
        <g class="num" transform="rotate(0) translate(166 0) scale(1 2.38)"><text x="0" y="0">π</text><circle r="13" fill="none" stroke="#f2c47c" stroke-width="1.8" opacity=".9"/></g>
        <g class="num" transform="rotate(120) translate(116 0) scale(1 2.38)"><text x="0" y="0">e</text><circle r="11" fill="none" stroke="#c0487e" stroke-width="1.8" opacity=".9"/></g>
        <g class="num" transform="rotate(240) translate(146 0) scale(1 2.38)"><text x="0" y="0">i</text><circle r="12" fill="none" stroke="#f2c47c" stroke-width="1.8" opacity=".9"/></g>
      </g>
    </g>
    <ellipse class="comet" cx="600" cy="215" rx="166" ry="70" fill="none" stroke="#f0b860" stroke-width="1.6" stroke-linecap="round" stroke-opacity=".8" filter="url(#glow3)"/>
  </g>

  <!-- singularity -->
  <g transform="translate(600 215)">
    <circle r="118" fill="url(#hub)" opacity=".88"/>
    <circle class="core-pulse" r="104" fill="none" stroke="#f7c77e" stroke-width="2.4" stroke-opacity=".9" filter="url(#faint)"/>
    <circle r="98" fill="none" stroke="#ca5d92" stroke-width="1.4" stroke-dasharray="2 10" stroke-opacity=".7"/>
    <circle r="58" fill="url(#nucleus)" filter="url(#glow3)"/>
    <circle r="38" fill="#000008"/>
    <circle r="3" fill="#ffe3a0" filter="url(#glow3)"/>
    <path d="M-20 0H20M0-20V20" stroke="#d6a45d" stroke-width=".8" stroke-opacity=".55"/>
  </g>

  <g class="cap">
    <text x="62" y="60">ORBITAL ENGINE / CLOCKWORK SINGULARITY</text>
    <text x="1128" y="380" text-anchor="end">π · e · i · φ · Σ · ∫ · ∞</text>
    <text x="62" y="392" fill="#c06a8b">NUMBERS IN MOTION, ALWAYS IN RELATION</text>
    <text x="1128" y="392" text-anchor="end" fill="#8f849b">HOVER THE GLYPHS TO VIEW</text>
  </g>
</svg>